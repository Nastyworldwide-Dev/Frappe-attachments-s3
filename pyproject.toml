[project]
name = "frappe_s3_attachment"
version = "0.1.9"
description = "Frappe app to make file upload to S3 through attach file option."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Frappe", email = "ramesh.ravi@zerodha.com" }]
requires-python = ">=3.10"
dependencies = ["python-magic==0.4.18"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "frappe_s3_attachment"

# Frappe compatibility range read by the app dependency resolver.
# Parsed by the `semantic_version` library (SimpleSpec), which requires
# comma-separated clauses: ">=15.0.0,<16.0.0". A space-separated npm-style
# range ">=15.0.0 <16.0.0" is rejected as an "Invalid simple block" and
# breaks Frappe Cloud deploys (agent builder._check_frappe_dependencies).
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
