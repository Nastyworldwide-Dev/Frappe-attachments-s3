[project]
name = "frappe_s3_attachment"
version = "0.1.15"
description = "Frappe app to make file upload to S3 through attach file option."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Frappe", email = "ramesh.ravi@zerodha.com" }]
requires-python = ">=3.10"
dependencies = ["python-magic==0.4.18", "boto3", "pyopenssl>=24.2.1"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "frappe_s3_attachment"

# Read by Frappe Cloud (press) and `bench get-app` to pick a compatible bench.
# NPM-style semver range; must be bounded on both ends.
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
